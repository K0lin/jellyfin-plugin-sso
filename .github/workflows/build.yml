on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        default: "10.0.x"
        description: "The .NET version to setup for the build"
        type: string
      dotnet-target:
        required: false
        default: "net10.0"
        description: "The .NET target to set for JPRM"
        type: string
      ref:
        required: false
        default: ""
        description: "The git ref to checkout for the build"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "${{ inputs.dotnet-version }}"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: "${{ inputs.dotnet-target }}"

      - name: Use 3-segment version in artifact filename
        id: artifact
        shell: bash
        run: |
          ARTIFACT='${{ steps.jprm.outputs.artifact }}'
          # JPRM always normalizes the version to 4 segments (x.y.z.w).
          # Strip a trailing ".0" revision so release assets match the
          # 3-segment versioning (e.g. sso-authentication_5.1.0.zip).
          NEW_ARTIFACT="${ARTIFACT}"
          if [[ "${ARTIFACT}" == *".0.zip" ]]; then
            NEW_ARTIFACT="${ARTIFACT%.0.zip}.zip"
            mv "${ARTIFACT}" "${NEW_ARTIFACT}"
          fi
          echo "artifact=${NEW_ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.artifact.outputs.artifact }}
