on:
  workflow_call:
    inputs:
      dotnet-version:
        required: false
        default: "10.0.x"
        description: "The .NET version to setup for the build"
        type: string
      dotnet-target:
        required: false
        default: "net10.0"
        description: "The .NET target to set for JPRM"
        type: string
      ref:
        required: false
        default: ""
        description: "The git ref to checkout for the build"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "${{ inputs.dotnet-version }}"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: "${{ inputs.dotnet-target }}"

      - name: Normalize artifact version (3-segment)
        id: artifact
        shell: bash
        env:
          ARTIFACT: ${{ steps.jprm.outputs.artifact }}
        run: |
          VERSION="$(grep -m1 '^version:' build.yaml | cut -d'"' -f2)"
          if [ -z "${VERSION}" ]; then
            echo "Unable to parse version from build.yaml" >&2
            exit 1
          fi
          export ARTIFACT VERSION
          # JPRM always normalizes the version to 4 segments (x.y.z.w) when it
          # writes meta.json and the artifact filename. Jellyfin 12 compares the
          # packaged meta.json version against the repository manifest version
          # (which comes from build.yaml) and logs a warning on mismatch, so
          # rewrite meta.json with the 3-segment version from build.yaml.
          python3 - <<'PY'
          import json, os, zipfile
          artifact = os.environ['ARTIFACT']
          version = os.environ['VERSION']
          tmp = artifact + '.tmp'
          with zipfile.ZipFile(artifact) as zin, zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename == 'meta.json':
                      meta = json.loads(data)
                      meta['version'] = version
                      data = (json.dumps(meta, indent=4) + '\n').encode('utf-8')
                  zout.writestr(item, data)
          os.replace(tmp, artifact)
          print(f"Set meta.json version to {version} in {artifact}")
          PY
          # Strip a trailing ".0" revision from the artifact filename so release
          # assets match the 3-segment versioning (e.g. sso-authentication_5.1.1.zip).
          NEW_ARTIFACT="${ARTIFACT}"
          if [[ "${ARTIFACT}" == *".0.zip" ]]; then
            NEW_ARTIFACT="${ARTIFACT%.0.zip}.zip"
            mv "${ARTIFACT}" "${NEW_ARTIFACT}"
          fi
          echo "artifact=${NEW_ARTIFACT}" >> "${GITHUB_OUTPUT}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.artifact.outputs.artifact }}
